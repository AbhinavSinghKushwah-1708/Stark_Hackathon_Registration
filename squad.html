<script>
    function addTeammate() {
        const container = document.getElementById('roster-container');
        if (container.children.length >= 3) {
            alert("Maximum squad capacity reached (4 members).");
            return;
        }
        
        const newRow = document.createElement('div');
        // Added 'teammate-row' class and updated grid template
        newRow.className = "teammate-row grid grid-cols-1 md:grid-cols-[1fr_1fr_1fr_auto] gap-4 p-4 bg-black/40 border border-gray-700 mt-4 group transition-all hover:border-gray-500";
        newRow.innerHTML = `
            <input type="text" placeholder="Operative Name" class="bg-gray-900/80 border border-gray-700 text-white px-3 py-2 text-sm focus:outline-none focus:border-stark-glow">
            <input type="email" placeholder="Email Address" class="bg-gray-900/80 border border-gray-700 text-white px-3 py-2 text-sm focus:outline-none focus:border-stark-glow">
            <select class="bg-gray-900/80 border border-gray-700 text-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-stark-glow appearance-none">
                <option value="" disabled selected>Select Protocol (Role)</option>
                <option value="ironman">Iron Man (Systems/Full-Stack)</option>
                <option value="spiderman">Spider-Man (Frontend/Web)</option>
                <option value="hulk">The Hulk (Backend/Data)</option>
                <option value="shuri">Shuri (UI/UX Design)</option>
                <option value="strange">Dr. Strange (AI/Algorithms)</option>
                <option value="rocket">Rocket Raccoon (DevOps/Cloud)</option>
                <option value="blackwidow">Black Widow (QA/Security)</option>
                <option value="vision">Vision (Data Science/Analytics)</option>
                <option value="antman">Ant-Man (Optimization)</option>
                <option value="fury">Nick Fury (Scrum Master)</option>
            </select>
            
            <!-- Dynamic Remove Button -->
            <button type="button" onclick="this.closest('.teammate-row').remove()" class="bg-gray-900/80 border border-gray-700 text-gray-500 hover:text-stark-red hover:border-stark-red hover:shadow-[0_0_10px_rgba(226,54,54,0.5)] px-4 py-2 transition-all flex items-center justify-center" title="Remove Operative">
                <i class="fa-solid fa-xmark"></i>
            </button>
        `;
        container.appendChild(newRow);
    }
