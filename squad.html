    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    const draftStorageKey = 'starkHackathonDraft';
    const registrationsStorageKey = 'starkHackathonRegistrations';
    const squadForm = document.getElementById('squad-form');
    const squadMessage = document.getElementById('squad-message');
    const squadMessageTitle = document.getElementById('squad-message-title');
    const squadMessageText = document.getElementById('squad-message-text');
    const finalizeButton = document.getElementById('finalize-squad');
    let registrationCompleted = false;
    const namePattern = /^[\p{L}\p{M}]+(?:[ .'-][\p{L}\p{M}]+)*\.?$/u;
    const memberCards = Array.from(squadForm.querySelectorAll('h3'), (heading) => heading.parentElement);
    const memberFields = memberCards.map((card) => ({
        name: card.querySelector('input[type="text"]'),
        email: card.querySelector('input[type="email"]'),
        role: card.querySelector('select')
    }));

    function showMessage(message, isError) {
        squadMessageTitle.textContent = isError ? 'Squad Finalization Failed' : 'Registration Successful';
        squadMessageTitle.className = `mb-4 font-stark text-2xl uppercase tracking-widest ${isError ? 'text-stark-red' : 'text-stark-glow'}`;
        squadMessageText.textContent = message;
        squadMessageText.className = `mb-6 break-words text-lg ${isError ? 'text-stark-red' : 'text-white'}`;
        if (!squadMessage.open) {
            squadMessage.showModal();
        }
        document.getElementById('close-squad-message').focus();
    }

    function readDraft() {
        const serializedDraft = localStorage.getItem(draftStorageKey);
        if (!serializedDraft) {
            return null;
        }
        const draft = JSON.parse(serializedDraft);
        if (!draft || !draft.commander || !draft.commander.name || !draft.commander.email || !draft.teamName) {
            throw new Error('The saved registration draft is incomplete.');
        }
        return draft;
    }

    function getMemberData() {
        return memberFields.map(({ name, email, role }) => ({
            name: name.value.trim(),
            email: email.value.trim(),
            role: role.value,
            roleName: role.selectedOptions[0].textContent.trim()
        }));
    }

    function saveDraft() {
        const draft = readDraft();
        if (!draft) {
            throw new Error('Registration details are missing. Return to the registration page and try again.');
        }
        draft.squad = getMemberData();
        localStorage.setItem(draftStorageKey, JSON.stringify(draft));
    }

    function setNameValidity(input) {
        const value = input.value.trim();
        input.setCustomValidity(
            value && (!namePattern.test(value) || /[bcdfghjklmnpqrstvwxz]{5,}/i.test(value))
                ? 'Enter a valid name using letters, spaces, apostrophes, periods, or hyphens.'
                : ''
        );
    }

    function generateRegistrationId(existingIds) {
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        for (let attempt = 0; attempt < 10; attempt += 1) {
            let id = '';
            while (id.length < 12) {
                const bytes = crypto.getRandomValues(new Uint8Array(16));
                for (const byte of bytes) {
                    if (byte < 248) {
                        id += alphabet[byte % alphabet.length];
                        if (id.length === 12) {
                            break;
                        }
                    }
                }
            }
            if (!existingIds.has(id)) {
                return id;
            }
        }
        throw new Error('Unable to create a unique registration ID. Please try again.');
    }

    try {
        const draft = readDraft();
        if (!draft) {
            throw new Error('No registration details found. Return to the registration page to begin.');
        }
        memberFields[0].name.value = draft.commander.name;
        memberFields[0].email.value = draft.commander.email;

        if (Array.isArray(draft.squad)) {
            draft.squad.slice(1).forEach((member, index) => {
                if (memberFields[index + 1]) {
                    memberFields[index + 1].name.value = member.name || '';
                    memberFields[index + 1].email.value = member.email || '';
                    memberFields[index + 1].role.value = member.role || '';
                }
            });
        }

        memberFields.forEach(({ name, email, role }, index) => {
            role.required = true;
            if (index > 0) {
                name.required = true;
                name.minLength = 2;
                name.maxLength = 60;
                email.required = true;
                name.addEventListener('input', () => setNameValidity(name));
                setNameValidity(name);
            }
            email.addEventListener('input', () => email.setCustomValidity(''));
            role.addEventListener('change', () => role.setCustomValidity(''));
        });

        squadForm.addEventListener('input', () => {
            if (registrationCompleted) {
                return;
            }
            try {
                saveDraft();
            } catch (error) {
                showMessage(error.message || 'Unable to save your squad draft in this browser.', true);
                console.error('Unable to save squad draft:', error);
            }
        });
        squadForm.addEventListener('change', () => {
            if (registrationCompleted) {
                return;
            }
            try {
                saveDraft();
            } catch (error) {
                showMessage(error.message || 'Unable to save your squad draft in this browser.', true);
                console.error('Unable to save squad draft:', error);
            }
        });
    } catch (error) {
        showMessage(error.message || 'Unable to load your saved registration.', true);
        finalizeButton.disabled = true;
        console.error('Unable to load registration draft:', error);
    }

    document.getElementById('close-squad-message').addEventListener('click', () => {
        window.location.href = 'index.html';
    });

    squadForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const editableEmails = memberFields.slice(1).map(({ email }) => email);
        const emailAddresses = [memberFields[0].email.value.trim(), ...editableEmails.map(({ value }) => value.trim())];
        const duplicateEmailIndex = emailAddresses.findIndex((email, index) => emailAddresses.indexOf(email) !== index);
        if (duplicateEmailIndex > 0) {
            editableEmails[duplicateEmailIndex - 1].setCustomValidity('Each operative must use a different email address.');
        }
        if (!squadForm.reportValidity()) {
            return;
        }

        try {
            const registrations = JSON.parse(localStorage.getItem(registrationsStorageKey) || '[]');
            if (!Array.isArray(registrations)) {
                throw new Error('Saved registration data is invalid. Please contact the site administrator.');
            }
            const existingIds = new Set(registrations.map(({ registrationId }) => registrationId));
            const registration = {
                registrationId: generateRegistrationId(existingIds),
                createdAt: new Date().toISOString(),
                teamName: readDraft().teamName,
                commander: {
                    name: memberFields[0].name.value.trim(),
                    email: memberFields[0].email.value.trim()
                },
                members: getMemberData()
            };

            // --- Send to backend server ---
            finalizeButton.disabled = true;
            finalizeButton.textContent = 'Transmitting...';
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(registration)
                });
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    console.warn('Server returned an error:', errorData);
                }
            } catch (networkError) {
                console.warn('Backend unreachable — data saved to browser only:', networkError);
            }

            // --- Also persist to localStorage as before ---
            registrations.push(registration);
            localStorage.setItem(registrationsStorageKey, JSON.stringify(registrations));
            registrationCompleted = true;
            try {
                localStorage.removeItem(draftStorageKey);
            } catch (error) {
                console.error('Unable to clear completed registration draft:', error);
            }
            showMessage(`Squad finalized successfully! Your 12-character registration ID is ${registration.registrationId}. Returning to the registration page in 5 seconds.`, false);
            window.setTimeout(() => {
                window.location.href = 'index.html';
            }, 5000);
        } catch (error) {
            finalizeButton.disabled = false;
            finalizeButton.textContent = 'Finalize Squad Protocol';
            showMessage(error.message || 'Unable to save your squad. Please enable browser storage and try again.', true);
            console.error('Unable to finalize squad:', error);
        }
    });
</script>
</body>
</html>
